spring.application.name=gestion-prets-bcm

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_prets
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Sécurité (JWT) ---
# Clé secrète qui signe les jetons (au moins 32 caractères).
# En production, la définir avec la variable d'environnement JWT_SECRET.
app.jwt.secret=${JWT_SECRET:cle-de-developpement-bcm-a-changer-en-production-2026}
# Durée de validité d'un jeton : 480 minutes = 8 heures (une journée de travail)
app.jwt.expiration-minutes=480

# Premier compte administrateur, créé seulement si la table utilisateurs est vide
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@BCM2026}

# --- Emails (SMTP) ---
# En développement : MailDev (faux serveur mail local, lancer la commande « maildev »),
# boîte de réception visible sur http://localhost:1080
# En production : mettre le serveur SMTP de la BCM avec les variables d'environnement MAIL_HOST, MAIL_PORT...
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Ne pas bloquer plus de 5 secondes si le serveur mail ne répond pas
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Notifications ---
# false = les emails ne sont pas envoyés, seulement écrits dans les logs
app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.expediteur=${MAIL_FROM:gestion-prets@bcm.mr}
# Rappel des prêts en retard : du lundi au vendredi à 8h00
# Format cron Spring : seconde minute heure jour-du-mois mois jour-de-la-semaine
app.notifications.rappel-cron=0 0 8 * * MON-FRI

# --- Annuaire d'entreprise (LDAP / Active Directory) ---
# false = connexion uniquement avec les comptes locaux de l'application
app.annuaire.enabled=${ANNUAIRE_ENABLED:true}

# DÉVELOPPEMENT : petit annuaire LDAP intégré, rempli avec le fichier annuaire-bcm.ldif
spring.ldap.embedded.base-dn=dc=bcm,dc=mr
spring.ldap.embedded.ldif=classpath:annuaire-bcm.ldif
spring.ldap.embedded.port=${LDAP_PORT:8389}

# PRODUCTION (Active Directory de la BCM) : supprimer les 3 lignes "embedded" ci-dessus et mettre :
#   spring.ldap.urls=ldaps://ad.bcm.mr:636
#   spring.ldap.username=CN=svc-gestion-prets,OU=Comptes de service,DC=bcm,DC=mr
#   spring.ldap.password=${LDAP_PASSWORD}
#   app.annuaire.base-utilisateurs=OU=Utilisateurs,DC=bcm,DC=mr
#   app.annuaire.filtre-connexion=(sAMAccountName={0})
#   app.annuaire.attribut-departement=department

# Où chercher les agents (toutes les directions en dessous), et avec quel attribut ils se connectent
# ({0} = identifiant saisi sur la page de connexion)
app.annuaire.base-utilisateurs=ou=personnes,dc=bcm,dc=mr
app.annuaire.filtre-connexion=(uid={0})
# Attributs lus dans la fiche de chaque agent
app.annuaire.attribut-matricule=employeeNumber
app.annuaire.attribut-departement=departmentNumber
app.annuaire.attribut-poste=title

# Règles d'accès (direction + poste → rôle) : voir application.yml
# (fichier YAML car il est lu en UTF-8 : les accents comme « Systèmes » y sont bien compris,
#  alors que ce fichier .properties est lu en ISO-8859-1 par Spring Boot)

# Synchronisation automatique des employés : chaque nuit à 2h00
app.annuaire.synchro-cron=0 0 2 * * *
