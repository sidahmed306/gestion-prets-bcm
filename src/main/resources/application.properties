spring.application.name=gestion-prets-bcm

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_prets
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Sécurité (JWT) ---
# Clé secrète qui signe les jetons (au moins 32 caractères).
# En production, la définir avec la variable d'environnement JWT_SECRET.
app.jwt.secret=${JWT_SECRET:cle-de-developpement-bcm-a-changer-en-production-2026}
# Durée de validité d'un jeton : 480 minutes = 8 heures (une journée de travail)
app.jwt.expiration-minutes=480

# Premier compte administrateur, créé seulement si la table utilisateurs est vide
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@BCM2026}

# --- Emails (SMTP) ---
# En développement : MailDev (faux serveur mail local, lancer la commande « maildev »),
# boîte de réception visible sur http://localhost:1080
# En production : mettre le serveur SMTP de la BCM avec les variables d'environnement MAIL_HOST, MAIL_PORT...
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Ne pas bloquer plus de 5 secondes si le serveur mail ne répond pas
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Notifications ---
# false = les emails ne sont pas envoyés, seulement écrits dans les logs
app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.expediteur=${MAIL_FROM:gestion-prets@bcm.mr}
# Rappel des prêts en retard : du lundi au vendredi à 8h00
# Format cron Spring : seconde minute heure jour-du-mois mois jour-de-la-semaine
app.notifications.rappel-cron=0 0 8 * * MON-FRI
